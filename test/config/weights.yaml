reference_tracking:
  yaw_rate: 0.0
  speed: 0.0
  sideslip: 0.0
  driven_wheel_speed: 0.0
  lateral_deviation: 20.0
  relative_heading: 10.0
  path_evolution: 30.0

velocity_profile: 
  weight: 50.0
  over_weight: 0.05

progress: 
  weight: 0.0

boundary: 
  weight: 200.0
  margin: 0.3

crash: 
  weight: 200000.0
  # weight: 600.0
  discount: 0.9
  buffer: 0.1

sideslip_limit: 
  weight: 0.0
  max_slip: 1.5
  kill_weight: 4000.0

lateral_damping: 
  weight: 1.0
  decay_rate: 0.2

wheel_slip: 
  weight: 500.0
  band: 1.1

# Rear steering mirrors the front steering weights. These are inert while the
# rear channel is pinned in mppi.yaml, but they must be non-zero before it is
# unpinned: a zero-weight channel is free to oscillate at no cost.
control_effort:
  steering_angle_rad: 0.0001
  wheel_torque_nm: 0.00001
  rear_steering_angle_rad: 0.0001

control_smoothness:
  steering_angle_rad: 100.0
  wheel_torque_nm: 0.01
  rear_steering_angle_rad: 10.0

# Penalize predicted longitudinal acceleration asymmetrically. Values are
# derived from consecutive speed states with the configured MPPI dt.
longitudinal_acceleration:
  acceleration_weight: 0.0
  deceleration_weight: 0.000

# Physical command-rate penalties, including the transition from measured EKF
# actuator feedback to the first candidate command.
control_rate:
  steering_velocity_radps: 5.5
  wheel_torque_rate_nmps: 50.0
  rear_steering_velocity_radps: 5.5
