reference_tracking:
  yaw_rate: 0.0
  speed: 0.0
  sideslip: 0.0
  driven_wheel_speed: 0.0
  lateral_deviation: 10.0
  relative_heading: 1.0
  path_evolution: 0.0

velocity_profile: 
  weight: 100.0
  over_weight: 0.05

progress: 
  weight: 1.0

boundary: 
  weight: 10.0
  margin: 0.2

crash: 
  weight: 600000.0
  discount: 0.9
  buffer: 0.1

sideslip_limit: 
  weight: 100.0
  max_slip: 1.2
  kill_weight: 4000.0

lateral_damping: 
  weight: 1.0
  decay_rate: 0.2

wheel_slip: 
  weight: 500.0
  band: 0.2

control_effort: 
  steering_angle_rad: 0.0001
  wheel_torque_nm: 0.00001

control_smoothness: 
  steering_angle_rad: 10000.0
  wheel_torque_nm: 10.0

# Penalize predicted longitudinal acceleration asymmetrically. Values are
# derived from consecutive speed states with the configured MPPI dt.
longitudinal_acceleration:
  acceleration_weight: 0.001
  deceleration_weight: 0.000

# Physical command-rate penalties, including the transition from measured EKF
# actuator feedback to the first candidate command.
control_rate:
  steering_velocity_radps: 0.20
  wheel_torque_rate_nmps: 0.1
