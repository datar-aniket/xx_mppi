# Jetson Orin NX target. K/T/dt are compile-independent runtime dimensions;
# changing them reallocates persistent CUDA buffers but does not alter messages.
num_samples: 4001
horizon: 60
dt: 0.1
solve_rate_hz: 180.0
control_publish_rate_hz: 180.0  # publish only the newest completed solution
maximum_solution_age_s: 0.4    # zero disables the stale-command guard
info_log_rate_hz: 10.0          # terminal ROS info summary of latest command
visualization_rate_hz: 20.0  # reduced-rate RViz publishing and rollout snapshots
# Rate of the per-term cost decomposition on xx_mppi/cost_terms. Only requested
# when the node is launched with publish_cost_terms:=true; the breakdown runs
# after the solve is measured, so it never enters the control path.
cost_terms_rate_hz: 10.0
num_rollouts: 15             # number of best-weighted sampled rollouts to draw
# Rollout frame. frenet integrates (e, dphi, s) against the raceline curvature;
# cartesian integrates (east, north, yaw_enu) and reprojects each state onto the
# raceline for the cost. Both use the same body model, costs and messages.
frame: frenet
integrator: euler
# The driven-wheel/tire loop is stiff: dt / integration_substeps must stay below
# I / (r^2 C), which is 0.039 s for the current vehicle profile. Startup fails
# with the required value if this is too coarse. On this map the cost is under
# 1 ms per solve because the rollout is dominated by the reference lookups.
integration_substeps: 8
lambda: 2.0
seed: 0

# ROS safety and control-output defaults. ROS parameters can override these.
require_solution_validity: false
require_vesc: false
publish_direct_control: true
direct_control_topic: direct_control
# torque: publish the wheel torque [N m] unchanged as DirectControl
# THROTTLE_TORQUE; ekf_mcu_driver maps it to motor current through
# xxCAR_bringup/calibration/wheel_torque_calibration.yaml (gear ratio, K_t and
# on-ground loss current) and clamps it. Requires direct_control_four_wheel.
# duty_cycle: scale/clamp the torque below into a raw throttle instead.
control_mode: torque
# Used only by control_mode duty_cycle.
direct_control_torque_to_throttle_scale: 50.0
direct_control_throttle_min: -50.0
direct_control_throttle_max: 50.0
# MPPI steering is positive-left. Set -1.0 when the actuator chain downstream of
# cmd_vel is positive-right (PID_lanekeeping compensates with invert_steering).
direct_control_steering_scale: 1.0
direct_control_steering_limit_rad: 1.0
direct_control_four_wheel: true
direct_control_four_wheel_topic: direct_control

observation:
  # EkfState steering [rad], wheel torque [N m], and motor speed [m/s] are copied
  # without scaling. Use measured feedback for the first control transition.
  use_measured_control_feedback: false
  # Largest sideslip the body model and sideslip costs may see. Projection still
  # uses the full measured course heading.
  maximum_model_sideslip_rad: 1.5

# Rear steering ships PINNED: zero sigma with zero-width bounds forces every
# candidate rear angle to exactly zero, so the solver plans front-steer-only
# trajectories. Keep it pinned until the rear servo is calibrated and
# bench-tested; docs/four_wheel_steering.md lists the steps to enable 4WS.
# Config load pins this channel anyway whenever the selected model does not
# steer the rear axle.
sigma:
  steering_angle_rad: 0.15
  wheel_torque_nm: 0.3
  rear_steering_angle_rad: 0.0

# Provisional torque bounds pending final vehicle characterization.
control_bounds:
  min: {steering_angle_rad: -0.4, wheel_torque_nm: -1.0, rear_steering_angle_rad: 0.0}
  max: {steering_angle_rad:  0.4, wheel_torque_nm: 0.8, rear_steering_angle_rad: 0.0}

noise_smoothing_window: 7
control_delay_steps: 0
control_cost_gamma: 0.8
special_samples: true
use_reference_controls: false
expected_trajectory: true

adaptation:
  adaptive_lambda: true
  ess_fraction_min: 0.002
  ess_fraction_max: 0.05
  lambda_min: 200
  lambda_max: 10000.0
  adaptive_sigma: true
  sigma_alpha: 0.1
  sigma_scale_min: 0.5
  sigma_scale_max: 2.0
  speed_scaled_steering: true
  steering_reference_speed_mps: 3.0
  steering_minimum_scale: 0.2

# One native CUDA multiple-shooting SQP pass refines the MPPI weighted mean.
# The MPPI expected states are intentionally accepted as an infeasible primal
# warm start; dynamics defects are equality residuals removed by SQP. If the
# final residual or the existing safety checks fail, the unrefined MPPI result
# remains the command and warm start.
mpc_refinement:
  enabled: true
  sqp_iterations: 3
  pcg_iterations: 48
  pcg_tolerance: 1.0e-4
  constraint_tolerance: 0.02
  finite_difference_relative_step: 1.0e-3
  hessian_regularization: 1.0e-3
  merit_constraint_penalty: 10000.0
  state_proximity_weight: 0.01
  control_proximity_weight: 1.0
  maximum_state_step: 5.0
  maximum_control_step:
    steering_angle_rad: 0.10
    wheel_torque_nm: 0.25
    rear_steering_angle_rad: 0.10
  maximum_control_rate:
    steering_velocity_radps: 4.0
    wheel_torque_rate_nmps: 10.0
    rear_steering_velocity_radps: 4.0
